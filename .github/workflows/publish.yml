# Stages the package on npm and creates a GitHub release whenever the version in package.json
# changes on main. Bump the version, merge to main, then approve the staged version with 2FA:
# `npm stage approve <stage-id>`, or on npmjs.com.
#
# It publishes with npm trusted publishing (no token, with provenance), set up on npmjs.com in
# the package's settings: GitHub Actions, this repository, workflow publish.yml.
name: Publish

on:
  push:
    branches: [main]
    paths: [package.json]
  # To run it again by hand, e.g. after a failed publish
  workflow_dispatch:

# One run at a time, so two quick merges can't stage the same version twice
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # create the tag and GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release notes list the commits since the last tag

      - uses: pnpm/action-setup@v4 # the version is package.json's packageManager

      # No registry-url: it writes a placeholder token to .npmrc, which gets in the way of OIDC
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x

      # Trusted publishing and `npm stage` need a recent npm
      - run: npm install -g npm@latest

      - name: Check what needs releasing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # Type-checks too (tsc), so a broken package fails here rather than on npm
      - if: steps.check.outputs.publish == 'true'
        run: pnpm build:lib

      # Staged versions go live only after approval with 2FA:
      # `npm stage approve <stage-id>` or on npmjs.com
      - name: Stage npm publish
        if: steps.check.outputs.publish == 'true'
        run: npm stage publish --access public

      - name: Create GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.check.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.check.outputs.version }}" \
            --generate-notes
